# General Application Settings
app:
  name: "Reel Factory"
  version: "0.1.0"
  timezone: "Asia/Kolkata"
  workdir: "/opt/data/VideoGeneratorBusinessRepo"
  runtime_dir: "/opt/data/VideoGeneratorBusinessRepo/runtime"
  
  # V1 constraints
  publishing_enabled: false
  language: "English"
  
  # Video specifications
  video:
    width: 1080
    height: 1920
    fps: 30
    codec: "h264"
    text_after_animation: true
    duration_min: 24
    duration_max: 40
    scene_min: 5
    scene_max: 7
